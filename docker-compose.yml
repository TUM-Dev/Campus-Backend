services:
  db:
    container_name: cloudsql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.27.0
    restart: unless-stopped
    command: tum-app-422909:europe-west1:tum-app-backend --credentials-file=/secrets/cloudsql/credentials.json --address 0.0.0.0 --port ${DB_PORT:-3306}
    networks:
      - traefik_traefik
    expose:
      - "${DB_PORT:-3306}"
    volumes:
      - /root/credentials/backend-gcp-cloudsql-credentials.json:/secrets/cloudsql/credentials.json

  backend:
    image: ghcr.io/tum-dev/campus-backend/backend-server:main
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Keep metrics internal: scrapers use backend:50051 directly, not these public routers.
      # HTTP/1 router + service
      - "traefik.http.routers.backend.entrypoints=webs"
      - "traefik.http.routers.backend.tls.certresolver=leacme"
      - "traefik.http.routers.backend.rule=Host(`api.tum.app`) && !PathPrefix(`/metrics`)"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=50051"
      # gRPC (h2c) router + service
      - "traefik.http.routers.backend_h2.entrypoints=webs"
      - "traefik.http.routers.backend_h2.tls.certresolver=leacme"
      - "traefik.http.routers.backend_h2.rule=Host(`api.tum.app`) && !PathPrefix(`/metrics`) && Header(`Content-Type`, `application/grpc`)"
      - "traefik.http.routers.backend_h2.service=backend_h2"
      - "traefik.http.services.backend_h2.loadbalancer.server.scheme=h2c"
      - "traefik.http.services.backend_h2.loadbalancer.server.port=50051"
      # gRPC-Web router (transcodes to gRPC via grpcweb middleware, forwards over h2c)
      - "traefik.http.middlewares.grpcweb.grpcweb.allowOrigins=*"
      - "traefik.http.routers.backend_grpcweb.entrypoints=webs"
      - "traefik.http.routers.backend_grpcweb.tls.certresolver=leacme"
      - "traefik.http.routers.backend_grpcweb.rule=Host(`api.tum.app`) && !PathPrefix(`/metrics`) && HeaderRegexp(`Content-Type`, `^application/grpc-web.*`)"
      - "traefik.http.routers.backend_grpcweb.middlewares=grpcweb"
      - "traefik.http.routers.backend_grpcweb.service=backend_h2"
    networks:
      - traefik_traefik
    expose:
      - "50051"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - DB_DSN=${DB_USER_NAME:-root}:${DB_USER_PASSWORD}@tcp(db:${DB_PORT:-3306})/${DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - DB_NAME=${DB_NAME}
      - SENTRY_DSN=${SENTRY_DSN}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - TUMONLINE_STATUS_SYNC_ENABLED=${TUMONLINE_STATUS_SYNC_ENABLED:-false}
      - ADMIN_BASE_URL=${ADMIN_BASE_URL:-}
      - ADMIN_OIDC_CLIENT_ID=${ADMIN_OIDC_CLIENT_ID:-}
      - ADMIN_OIDC_CLIENT_SECRET=${ADMIN_OIDC_CLIENT_SECRET:-}
      - ADMIN_ALLOWED_SUBJECTS=${ADMIN_ALLOWED_SUBJECTS:-}
      - ADMIN_OIDC_ISSUER=${ADMIN_OIDC_ISSUER:-https://tumidp.lrz.de/idp/shibboleth}
      - ADMIN_OIDC_AUTH_URL=${ADMIN_OIDC_AUTH_URL:-https://login.tum.de/idp/profile/oidc/authorize}
      - ADMIN_OIDC_TOKEN_URL=${ADMIN_OIDC_TOKEN_URL:-https://login.tum.de/idp/profile/oidc/token}
      - ADMIN_OIDC_JWKS_URL=${ADMIN_OIDC_JWKS_URL:-https://login.tum.de/idp/profile/oidc/keyset}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_URL=${SMTP_URL:-postout.lrz.de}
      - SMTP_USERNAME=${SMTP_USERNAME:-bot@tum.app}
      - SMTP_FROM=${SMTP_FROM:-bot@tum.app}
      - SMTP_PORT=${SMTP_PORT:-587}
    volumes:
      - backend-storage:/Storage
    user: 1000:3000
    read_only: true
    depends_on:
      db:
        condition: service_started

volumes:
  backend-storage:
    driver: local

networks:
  traefik_traefik:
    external: true
