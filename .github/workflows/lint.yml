name: lint
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [server, client]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false # golangci-lint-action manages its own cache
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
          args: --timeout=30m
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            server/go.sum
            server/api/installBuf.bash
      - run: bash server/api/installBuf.bash
      - name: pre-commit
        uses: pre-commit/action@v3.0.1
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
      - uses: ls-lint/action@v2.3.1
        with:
          config: .ls-lint.yaml
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        if: github.ref == 'refs/heads/main'
        with:
          commit-message: fixed formatting mistakes have sneaked into prod
          title: "chore(formatting): Fixed formatting mistakes"
          body: |
            - There has been a mishap and formatting mistakes have sneaked into prod
            - Auto-generated by [create-pull-request][1]
            PR comes from [this Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            [ 1 ]: https://github.com/peter-evans/create-pull-request
          assignees: CommanderStorm
          branch: chore/formatting-fixes
          delete-branch: true

  # Aggregates the jobs above under the "lint" name required by branch protection.
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [golangci-lint, pre-commit]
    if: always()
    steps:
      - run: |
          [[ "${{ needs.golangci-lint.result }}" == "success" && "${{ needs.pre-commit.result }}" == "success" ]]
