name: Migration Test
on:
  pull_request:
    branches: [ main ]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  test_migrations:
    runs-on: ubuntu-latest
    services:
      auto_mysql:
        image: mysql:26
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: super_secret_passw0rd
          MYSQL_DATABASE: campus_db
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h localhost -u root --password=super_secret_passw0rd"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      manual_mysql:
        image: mysql:26
        ports:
          - 3300:3306
        env:
          MYSQL_ROOT_PASSWORD: super_secret_passw0rd
          MYSQL_DATABASE: campus_db
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -h localhost -u root --password=super_secret_passw0rd"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: |
            server/go.sum
      - name: build server
        run: go build -o /tmp/campus-backend .
        working-directory: ./server
      - name: run manual and auto migrations
        working-directory: ./server
        env:
          CI_EXIT_AFTER_MIGRATION: "true"
          DB_NAME: campus_db
          ENVIRONMENT: dev
        run: |
          # both target separate databases, so they can run concurrently
          CI_AUTO_MIGRATION=false DB_DSN="root:super_secret_passw0rd@tcp(localhost:3306)/campus_db?charset=utf8mb4&parseTime=True&loc=Local" /tmp/campus-backend > manual.log 2>&1 & manual=$!
          CI_AUTO_MIGRATION=true DB_DSN="root:super_secret_passw0rd@tcp(localhost:3300)/campus_db?charset=utf8mb4&parseTime=True&loc=Local" /tmp/campus-backend > auto.log 2>&1 & auto=$!
          status=0
          wait $manual || { echo "::error::manual migration failed"; status=1; }
          wait $auto || { echo "::error::auto migration failed"; status=1; }
          echo "::group::manual migration log"; cat manual.log; echo "::endgroup::"
          echo "::group::auto migration log"; cat auto.log; echo "::endgroup::"
          exit $status
      - uses: ariga/setup-atlas@master
      - name: export diff the migrations
        id: diff_migrations
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64) &&
          echo "local_to_auto<<$EOF" >> $GITHUB_OUTPUT &&
          atlas schema diff --from "mysql://root:super_secret_passw0rd@localhost:3300/?charset=utf8mb4&parseTime=True&loc=Local" --to "mysql://root:super_secret_passw0rd@localhost:3306/?charset=utf8mb4&parseTime=True&loc=Local" --format '{{ sql . "  " }}' >> $GITHUB_OUTPUT &&
          echo "$EOF" >> $GITHUB_OUTPUT
          echo "auto_to_local<<$EOF" >> $GITHUB_OUTPUT &&
          atlas schema diff --from "mysql://root:super_secret_passw0rd@localhost:3306/?charset=utf8mb4&parseTime=True&loc=Local" --to "mysql://root:super_secret_passw0rd@localhost:3300/?charset=utf8mb4&parseTime=True&loc=Local" --format '{{ sql . "  " }}' >> $GITHUB_OUTPUT &&
          echo "$EOF" >> $GITHUB_OUTPUT
      - name: Find Comment
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: "${{ github.event.number }}"
          body-includes: Found the following differences in the sql schema
          comment-author: github-actions[bot]
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: "${{ github.event.number }}"
          comment-id: "${{ steps.fc.outputs.comment-id }}"
          body: |
            :eyes: Found the following differences in the sql schema:

            <details>
            <summary>Needed get from <b>local</b> to <b>auto</b> migration state</summary>

            ```sql
            ${{ steps.diff_migrations.outputs.local_to_auto }}
            ```

            </details>
            <details>
            <summary>Needed from <b>auto</b> to <b>local</b> migration state</summary>

            ```sql
            ${{ steps.diff_migrations.outputs.auto_to_local }}
            ```

            </details>
          edit-mode: replace
